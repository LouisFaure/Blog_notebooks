# Notebooks published as blog posts on louis.faure.dev.
#
# The website (LouisFaure/HomePage, where this repo is the notebooks/ submodule) converts each listed notebook
# with scripts/notebooks2posts.py into content/post/<slug>/: the notebook's saved outputs are used (it is not
# re-run), its first "# Title" heading becomes the post title, and figures become output_<cell>_<n>.png.
# Notebooks that are not listed here are not published.
#
#   notebook  path of the .ipynb in this repo
#   slug      post folder / URL: louis.faure.dev/post/<slug>/
#   date      publication date
#   math      optional, render LaTeX math (default true)
#   badge     optional, show the "Jupyter" badge linking to the notebook under the title (default true)

[[post]]
notebook = "efficient_code_python/Efficient_code_python.ipynb"
slug = "efficient_code_python"
date = 2024-03-29

[[post]]
notebook = "negative_binomial/negative_binomial.ipynb"
slug = "nb"
date = 2025-06-01
badge = false

[[post]]
notebook = "gradLines/grad_vs_EM.ipynb"
slug = "grad_vs_EM"
date = 2024-05-27
